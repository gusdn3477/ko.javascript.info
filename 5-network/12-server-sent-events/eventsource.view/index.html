<!DOCTYPE html>
<script>
let eventSource;

function start() { // "시작" 버튼을 눌렀을 때
  if (!window.EventSource) {
    // IE 또는 구형 브라우저
    alert("이 브라우저는 EventSource를 지원하지 않습니다.");
    return;
  }

  eventSource = new EventSource('digits');

  eventSource.onopen = function(e) {
    log("이벤트: open");
  };

  eventSource.onerror = function(e) {
    log("이벤트: error");
    if (this.readyState == EventSource.CONNECTING) {
      log(`재연결 중입니다(readyState=${this.readyState})...`);
    } else {
      log("에러가 발생했습니다.");
    }
  };

  eventSource.addEventListener('bye', function(e) {
    log("이벤트: bye, 데이터: " + e.data);
  });

  eventSource.onmessage = function(e) {
    log("이벤트: message, 데이터: " + e.data);
  };
}

function stop() { // "중지" 버튼을 눌렀을 때
  eventSource.close();
  log("eventSource.close()");
}

function log(msg) {
  logElem.innerHTML += msg + "<br>";
  document.documentElement.scrollTop = 99999999;
}
</script>

<button onclick="start()">시작</button> 시작하려면 "시작"을 누르세요.
<div id="logElem" style="margin: 6px 0"></div>

<button onclick="stop()">중지</button> 끝내려면 "중지"를 누르세요.
